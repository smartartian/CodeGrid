<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#083a6d"/>
      <stop offset="1" stop-color="#0d4a8a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#g)"/>
  <!-- 网格线纹理 -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
  </g>
  <!-- 红色装饰线 -->
  <rect x="40" y="64" width="42" height="5" fill="#c41e2a"/>
  <rect x="40" y="76" width="560" height="1" stroke="#c41e2a" stroke-dasharray="4 4" fill="none" opacity="0.7"/>
  <!-- 分类标签 -->
  <rect x="40" y="30" width="72" height="24" rx="3" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.35)"/>
  <text x="52" y="46" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#fff">运维</text>
  <!-- 大标题首字 -->
  <text x="40" y="290" font-family="'Microsoft YaHei',sans-serif" font-size="150" font-weight="700" fill="rgba(255,255,255,0.10)">运</text>
  <!-- 底部装饰 -->
  <rect x="40" y="316" width="560" height="2" fill="rgba(255,255,255,0.25)"/>
</svg>